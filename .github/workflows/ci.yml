name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.13.3
    secrets: inherit
    with:
      test-glob: test/integration/*.test.mjs
      windows-test: npm run test:windows
      shards: 1
      review-prompt: |
        SLICC-AUDIO

        This repository is slicc-audio (`@ai-ecoverse/slicc-audio`): `say`, `hear`, `afplay` and `chime` (and the four `sc*` names) for SLICC as POSIX `sh` in `bin/` and `sh/` over the slicc-kernel's `/dev/embedder`, the page module `page/` that answers those requests in seven's page (Web Audio, getUserMedia, Web Speech, slicc-ortllama over HTTP), and `scsay`, `schear`, `scplay` and `scchime` for ordinary hosts as Node in `host/` (say and afplay on macOS; spd-say or espeak-ng, and paplay, pw-play, aplay or ffplay on Linux; PowerShell on Windows; whisper.cpp, slicc-ortllama or Ollama for speech engines). The README is the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        Look for real defects, in this order:
        1. Correctness: the sh scripts are POSIX `sh` (dash) over coreutils only, and match the page module's request kinds and options; each command accepts the options the README lists, with the exit codes it names (0, 1 for a missing tool or a failing one, 2 for an option that can't work); `host/` picks the tool, engine and argv the README names for each platform, in its order.
        2. Security: tools run with a fixed argv and no shell; text to speak and transcripts reach no log, error or other process than the one engine; downloads are checked before use.
        3. Tests: every behaviour change has an integration test in `test/integration/`, host tests use fake tools on `PATH` and fake HTTP servers, CI downloads no real model, and a fix's test fails without the fix.
        4. Repo rules: no comments anywhere (YAML too), no unit tests in git, and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).
