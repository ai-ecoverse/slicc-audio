assert_lefthook_installed: true

extends:
  - node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml

pre-commit:
  parallel: false
  jobs:
    - name: shared hooks
      run: test -f node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml || { echo 'slicc-shared-web hooks missing, run npm install'; exit 1; }
    - name: script diff coverage
      glob: "{bin,sh}/*"
      run: SLICC_UNIT_COVERAGE_DIR=coverage/script npm run --silent test:unit && npx --no-install slicc-diff-cover coverage/script/lcov.info
